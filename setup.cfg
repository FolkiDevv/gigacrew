# Настройки инструментов, которые не читают pyproject.toml.

[flake8]
# flake8 запускает только wemake-python-styleguide (как в wemake-django-template):
# остальное проверяет ruff. https://wemake-python-styleguide.rtfd.io/en/latest/pages/usage/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true
select = WPS, E99
extend-exclude = .venv

max-line-length = 100

# Пороги сложности. По умолчанию — значения шаблона; поправки — под проект:
# строки до 100 символов (у шаблона 80) — сложность строки 20 вместо 14; классификатор
# команд, цикл агента и разбор протоколов — крупнее CRUD-кода, под который настроен шаблон.
max-line-complexity = 20
max-local-variables = 10
max-cognitive-score = 20
max-cognitive-average = 10
max-returns = 7
max-expressions = 12
max-arguments = 7
max-methods = 15
max-module-members = 15
max-imports = 20
max-string-usages = 5
max-try-body-length = 3

# Словарь предметной области: параметры инструмента (Tool.Params / params), содержимое
# сообщения модели (content), обработчик хука (handler).
allowed-domain-names = params, content, handler
# __all__ — явный список экспорта: на нём держится реэкспорт при mypy --strict.
allowed-module-metadata = __all__

per-file-ignores =
  # Тесты: имя теста — его описание, данные теста повторяются, проверок много;
  # интеграционные тесты импортируют все слои, которые проверяют.
  tests/*.py: WPS118, WPS201, WPS202, WPS203, WPS204, WPS218, WPS226, WPS432, WPS430, WPS431
  # Tool.Params — модель параметров инструмента (класс), а не константа. flake8 берёт
  # одно, самое точное совпадение шаблона: у файлов со своей строкой коды повторены.
  gigacrew/tools/*.py: WPS115
  tests/fakes.py: WPS115, WPS118, WPS201, WPS202, WPS203, WPS204, WPS218, WPS226, WPS432, WPS430, WPS431
  # Классификатор команд — таблицы политик по семействам программ: функция на
  # семейство, флаги и имена программ повторяются по таблицам. Граница безопасности:
  # дробить политики ради метрик — риск изменить решения классификатора.
  gigacrew/safety/programs.py: WPS202, WPS204, WPS210, WPS212, WPS226, WPS231, WPS232
  gigacrew/safety/python.py: WPS202, WPS226
  gigacrew/safety/bash.py: WPS202, WPS214
  # Центральные классы: протокол событий агента и его реализации, сессия агента,
  # история диалога, провайдеры LLM, LSP-сервер — их методы и есть интерфейс.
  gigacrew/agent/events.py: WPS214
  gigacrew/agent/conversation.py: WPS214
  gigacrew/agent/loop.py: WPS201, WPS203, WPS214
  gigacrew/ui/console.py: WPS201, WPS202, WPS203, WPS214
  gigacrew/llm/gigacode.py: WPS214
  gigacrew/project/semantic.py: WPS214
  gigacrew/llm/transport.py: WPS214
  gigacrew/project/index.py: WPS202, WPS214
  gigacrew/project/symbols.py: WPS202, WPS214
  # Кодек Chat Completions: набор малых чистых функций запроса, ответа и потока.
  gigacrew/llm/openai_chat.py: WPS202
  # Точки сборки: связывают все слои, по импорту на модуль.
  gigacrew/cli/app.py: WPS201
  gigacrew/cli/prompt.py: WPS201
  # Реестры: обработчик на слеш-команду, инструмент на модуль, грамматика на язык.
  gigacrew/cli/commands.py: WPS202
  gigacrew/tools/fs.py: WPS115, WPS202
  gigacrew/project/treesitter.py: WPS202, WPS226
