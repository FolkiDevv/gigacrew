# Настройки инструментов, которые не читают pyproject.toml.

[flake8]
# flake8 запускает только wemake-python-styleguide (как в wemake-django-template):
# остальное проверяет ruff. https://wemake-python-styleguide.rtfd.io/en/latest/pages/usage/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true
select = WPS, E99
extend-exclude = .venv

max-line-length = 100

# Пороги сложности. По умолчанию — значения шаблона; поправки — под проект:
# строки до 100 символов (у шаблона 80) — сложность строки 20 вместо 14; классификатор
# команд, цикл агента и разбор протоколов — крупнее CRUD-кода, под который настроен шаблон.
max-line-complexity = 20
max-local-variables = 10
max-cognitive-score = 20
max-cognitive-average = 10
max-returns = 7
max-expressions = 12
max-arguments = 7
max-methods = 15
max-module-members = 15
max-imports = 20
max-string-usages = 5
max-try-body-length = 3

# Словарь предметной области: параметры инструмента (Tool.Params / params), содержимое
# сообщения модели (content), обработчик хука (handler).
allowed-domain-names = params, content, handler
# __all__ — явный список экспорта: на нём держится реэкспорт при mypy --strict.
allowed-module-metadata = __all__

per-file-ignores =
  # Тесты: имя теста — его описание, данные теста повторяются, проверок много.
  tests/*.py: WPS118, WPS202, WPS204, WPS218, WPS226, WPS432, WPS430, WPS431
