[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[project]
name = "gigacrew"
version = "0.6.0"
description = "Консольный помощник для работы с кодом проекта"
readme = "README.md"
authors = [
    { name = "FolkiDevv", email = "hi@folki.dev" }
]
requires-python = ">=3.13"
# SPDX-выражение (PEP 639). Классификатора `License ::` нет намеренно: PyPI отклоняет пакет,
# в котором есть и то, и другое.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "agent", "llm", "code", "assistant", "tree-sitter", "lsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "rich>=13.0",
    "prompt_toolkit>=3.0.43",  # placeholder, create_pipe_input
    "ty==0.0.86",  # LSP-сервер для точной навигации по Python; бета — пин точный
    # tree-sitter: API ломается между минорами — пин; грамматики (MIT, офлайн) сверены
    # tests/test_treesitter.py, несовместимая грамматика — откат на построчные шаблоны
    "tree-sitter~=0.26.0",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-bash>=0.25",
    "tree-sitter-scala>=0.26",
    "tree-sitter-swift>=0.7",
]

[dependency-groups]
# Ставится `uv sync` по умолчанию (PEP 735). Только для разработки — в пакет не попадает.
dev = ["pytest>=7.0", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
gigacrew = "gigacrew.cli:main"

[project.urls]
Homepage = "https://github.com/FolkiDevv/gigacrew"
Repository = "https://github.com/FolkiDevv/gigacrew"
Issues = "https://github.com/FolkiDevv/gigacrew/issues"

[tool.uv.build-backend]
# Плоская раскладка: пакет лежит в корне репозитория, а не в src/.
module-root = ""

# Только для ручного workflow публикации в TestPyPI; `explicit` не пускает индекс в разрешение зависимостей.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E,F — pyflakes/pycodestyle; I — isort; UP — pyupgrade; B — bugbear; W — warnings.
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "live: тесты, реально обращающиеся к API (нужны реквизиты, GIGACREW_API_URL и GIGACREW_TEST_MODEL)",
]
testpaths = ["tests"]
