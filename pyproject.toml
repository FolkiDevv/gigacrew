[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[project]
name = "gigacrew"
version = "0.8.1"
description = "Консольный помощник для работы с кодом проекта"
readme = "README.md"
authors = [
    { name = "FolkiDevv", email = "hi@folki.dev" }
]
requires-python = ">=3.13"
# SPDX-выражение (PEP 639) вместо классификатора `License ::` — одно из двух, не оба.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "agent", "llm", "code", "assistant", "tree-sitter", "lsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    # Проект не публикуется: PyPI отклоняет пакет с этим классификатором, случайный
    # `uv publish` не пройдёт.
    "Private :: Do Not Upload",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "rich>=13.0",
    "prompt_toolkit>=3.0.52",  # placeholder, create_pipe_input; атрибуты dim/nodim в стилях
    "ty==0.0.86",  # LSP-сервер для точной навигации по Python; бета — пин точный
    # tree-sitter: API ломается между минорами — пин; грамматики (MIT, офлайн) сверены
    # tests/test_treesitter.py, несовместимая грамматика — откат на построчные шаблоны
    "tree-sitter~=0.26.0",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23.4",
    # bash — ещё и для классификатора команд (gigacrew/safety): правила опираются на имена
    # узлов грамматики, поэтому верхняя граница — до сверки с новой версией
    "tree-sitter-bash>=0.25,<0.26",
    "tree-sitter-scala>=0.26",
    "tree-sitter-swift>=0.7",
]

[dependency-groups]
# Ставится `uv sync` по умолчанию (PEP 735). Только для разработки — в пакет не попадает.
# Набор проверок — по образцу wemake-django-template (см. `make lint`).
dev = [
    # Тесты
    "pytest>=9.1",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    # Стиль, форматирование, типы, архитектура
    "ruff>=0.17",
    "wemake-python-styleguide>=1.8",
    "mypy>=2.4",
    "import-linter>=2.15",
    # Опечатки, YAML, .env, зависимости
    "codespell>=2.4",
    "typos>=1.51",
    "yamllint>=1.38",
    "dotenv-linter>=0.9",
    "deptry>=0.25",
    "pip-audit>=2.10",
]

[project.scripts]
gigacrew = "gigacrew.cli:main"

[project.urls]
Homepage = "https://github.com/FolkiDevv/gigacrew"
Repository = "https://github.com/FolkiDevv/gigacrew"

[tool.uv.build-backend]
# Плоская раскладка: пакет лежит в корне репозитория, а не в src/.
module-root = ""

[tool.ruff]
# Настройки — по образцу wemake-django-template (https://docs.astral.sh/ruff/settings),
# с поправками на проект: строка 100 символов и двойные кавычки — устоявшийся стиль кода.
preview = true
line-length = 100
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "COM",   # flake8-commas
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle
    "ERA",   # flake8-eradicate
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T100",  # flake8-debugger
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle
    "YTT",   # flake8-2020
]
ignore = [
    "A005",    # имена модулей могут совпадать с модулями stdlib (gigacrew.tools.shell…)
    # Правила документации, которые шаблон тоже не проверяет:
    "D100",
    "D104",
    "D106",
    "D203",
    "D212",
    "D401",
    "D404",
    "D405",
    "ISC001",  # конфликтует с `ruff format`
    "ISC003",  # явная конкатенация строк предпочтительнее неявной
    "PLR09",   # сложность проверяет wemake-python-styleguide
    "PLR2004", # магические числа проверяет wemake-python-styleguide (WPS432)
    "PLR6301", # метод без self не обязан становиться staticmethod/classmethod
    "PLW0717", # длину тела try проверяет wemake-python-styleguide (WPS229)
    "RUF067",  # логику в `__init__.py` проверяет wemake-python-styleguide (WPS412)
    "TRY003",  # длинные сообщения исключений — нормально
    "RUF105",  # `# noqa`, а не `# ruff: ...`
    "RUF106",
    "RUF201",
    # Проект: запуск git, оболочки и LSP-серверов — суть инструмента; аргументы
    # передаются списком, без shell, программы ищутся в PATH.
    "S404",
    "S603",
    "S607",
]
# Коды wemake-python-styleguide (flake8): ruff не считает их `noqa` лишними.
external = ["WPS"]
# Комментарии и строки — на русском: однобуквенные слова «с», «у», «о», «а»… и типографика
# (–, −, ×, ❯) — не подмена латиницы.
allowed-confusables = [
    "а", "б", "в", "г", "е", "к", "м", "н", "о", "р", "с", "т", "у", "х", "з",
    "А", "В", "Е", "З", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х",
    "–", "−", "×", "❯",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101",   # assert — суть теста
    "D1",     # имя теста — его описание: длинные имена вместо docstring
    "SLF001", # тесты «белого ящика» смотрят во внутреннее состояние
    "S105",   # поддельные токены и пароли — данные теста
    "S106",
    "S107",
    "S108",   # пути /tmp/… — данные для классификатора путей
]

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html — как в wemake-django-template.
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "unimported-reveal",
    "deprecated",
    "exhaustive-match",
]
strict = true
extra_checks = true
strict_equality_for_none = true
warn_unreachable = true
explicit_package_bases = true
# Тесты импортируют общие модули из tests/ без пакета (fakes, behavior…), как pytest
# в режиме prepend.
mypy_path = ["$MYPY_CONFIG_FILE_DIR", "$MYPY_CONFIG_FILE_DIR/tests"]
files = ["gigacrew", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
markers = [
    "live: тесты, реально обращающиеся к API (нужны реквизиты, GIGACREW_API_URL и GIGACREW_TEST_MODEL)",
    "eval: поведенческие сценарии на живых моделях — дорого, запуск через make eval (tests/test_behavior_live.py)",
]
testpaths = ["tests"]
# Строгость — как в wemake-django-template: опечатка в маркере или настройке — ошибка,
# xfail, который вдруг прошёл, — тоже. Порядок тестов случайный (pytest-randomly).
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true

[tool.deptry]
known_first_party = ["gigacrew"]

[tool.deptry.per_rule_ignores]
# Грамматики tree-sitter загружаются по имени (importlib, gigacrew/project/treesitter.py).
DEP002 = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-kotlin",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-bash",
    "tree-sitter-scala",
    "tree-sitter-swift",
]

[tool.codespell]
# https://github.com/codespell-project/codespell
skip = "*.lock,.venv,.git,.*_cache,htmlcov,.coverage,coverage.xml"
# Опечатки, которые проверяют тесты (ввод пользователя с ошибкой), и имена программ.
ignore-words-list = "alph,deplyo,hlep,ture"

[tool.typos]
# https://github.com/crate-ci/typos
files.extend-exclude = ["*.lock", ".venv", ".*_cache", "htmlcov", ".coverage", "coverage.xml"]
default.extend-ignore-re = [
    "\\b[0-9a-f]{7,40}\\b", # хеши коммитов
]

[tool.typos.default.extend-words]
# Имена пакетов, функций и флагов: certifi, os.spawnve, `rg -iz`, `nl -ba`.
certifi = "certifi"
spawnve = "spawnve"
iz = "iz"
ba = "ba"
# Опечатки, которые проверяют тесты (ввод пользователя с ошибкой).
alph = "alph"
deplyo = "deplyo"
hlep = "hlep"
ture = "ture"
